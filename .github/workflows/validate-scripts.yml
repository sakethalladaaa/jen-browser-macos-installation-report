name: Validate diagnostic scripts

on:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/validate-scripts.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/validate-scripts.yml'

jobs:
  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax (does not execute macOS checks)
        shell: bash
        run: |
          for f in scripts/*.sh; do
            echo "Checking $f"
            bash -n "$f"
          done
